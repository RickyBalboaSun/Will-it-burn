<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1424">
<meta name="description" content="Will tonight's sunset be worth watching? A 0–100 score from cloud, haze and the light path to the horizon.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Will It Burn?">
<title>Will It Burn?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
<div class="sky" id="sky"></div>
<div class="wrap">
  <header class="top">
    <div class="brand">Will It Burn?</div>
    <div class="top-actions">
      <button class="pill" id="placeBtn" hidden>Change place</button>
    </div>
  </header>

  <!-- loading -->
  <section class="center" id="loading">
    <div class="spinner"></div>
    <div class="status" id="loadingText">Finding your location…</div>
  </section>

  <!-- place picker -->
  <section class="center" id="picker" hidden>
    <div class="status" id="pickerText">Where are you watching from?</div>
    <form class="search" id="searchForm">
      <input id="q" type="search" placeholder="Town or place" autocomplete="off" enterkeyhint="search">
      <button class="btn" type="submit">Search</button>
      <button class="btn ghost" type="button" id="gpsBtn">Use my location</button>
      <div class="err" id="searchErr" hidden></div>
      <div class="results" id="results"></div>
    </form>
  </section>

  <!-- result -->
  <main id="result" hidden>
    <div class="seg" role="tablist" aria-label="Sunset or sunrise">
      <button id="kindSunset" class="on" role="tab">Sunset</button>
      <button id="kindSunrise" role="tab">Sunrise</button>
    </div>

    <div class="loc" id="loc">
      <div class="loc-name" id="locName"></div>
      <div class="loc-sub" id="locSub"></div>
      <div class="loc-warn" id="locWarn" hidden></div>
    </div>

    <section class="hero">
      <div class="when" id="when"></div>
      <div class="score"><span id="score"></span><small>/100</small></div>
      <div class="verdict" id="verdict"></div>
      <div class="countdown" id="countdown"></div>
      <div class="offline" id="offline" hidden></div>
      <ul class="reasons" id="reasons"></ul>
    </section>

    <section class="card rate" id="rateCard" hidden>
      <h2 id="rateTitle">How was it?</h2>
      <div class="rate-sub" id="rateSub"></div>
      <div class="scale" id="scale" role="radiogroup" aria-label="Your rating out of 10"></div>
      <div class="rubric" id="rubric">Tap a number. Rate what you saw, not the photo.</div>
      <textarea class="field notes" id="rateNotes" rows="2" placeholder="Where was the colour? When did it peak?"></textarea>
      <div class="row">
        <button class="btn small" id="rateSave">Save rating</button>
        <button class="btn small ghost" id="rateCopy" hidden>Copy for Claude</button>
      </div>
      <div class="rate-msg" id="rateMsg"></div>
    </section>

    <section class="card">
      <h2 id="weekTitle">The week ahead</h2>
      <div class="week" id="week"></div>
    </section>

    <section class="card">
      <h2>When to watch</h2>
      <div class="times" id="times"></div>
      <div class="note" id="timesNote"></div>
    </section>

    <details class="card" id="logCard" hidden>
      <summary>Your sunset log <span class="count" id="logCount"></span></summary>
      <div class="detail-body">
        <div id="logList"></div>
        <button class="btn small ghost" id="logCopyAll">Copy all for Claude</button>
        <div class="rate-msg" id="logMsg"></div>
      </div>
    </details>

    <details class="card" id="details">
      <summary>Why this score</summary>
      <div class="detail-body" id="detailBody"></div>
    </details>
  </main>

  <footer class="foot">
    Forecast by <a href="https://open-meteo.com">Open-Meteo</a> · Model <span id="modelVersion"></span><br>
    Scores are predictions, not promises.
  </footer>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
